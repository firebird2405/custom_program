# ============================================================================
# 쁘띠캘린더(PetitCalendar) — electron-builder 설정 정본
#
# 계약 근거: protocol/SCORECARD-rev6-draft.md
#   A42 — 패키지 리소스의 calendar.html·postit.html은 저장소 원본과 SHA256 동일
#         (빌드 변형·주입 금지). main.js는 __dirname/'..'로 해석하므로
#         app.asar 기준 '..' == resources/ — 아래 extraResources가 그 자리에
#         원본을 "복사만" 한다 (변형 0).
#   A44 — 앱 런타임 외부 요청 0. 이 설정은 autoUpdater·publish 구성을 두지 않는다.
#   A46 — 화이트리스트 패키징: backups/ · .edge/ · protocol/ · *.log ·
#         실사용 저장 데이터는 어떤 산출물에도 절대 동봉되지 않는다.
#         (files·extraResources에 열거된 것 외에는 아무것도 실리지 않는 구조)
#   A48 — 아이콘은 build/icon.png(512) + build/appx/ 실규격 세트 (자체 제작).
#
# 빌드: cd electron ; npx electron-builder --dir   (1주차 — win-unpacked 검증)
#       3주차: npm run dist:appx  (identity 기입 후 — check-appx-identity.js 가드가
#               미기입 상태에서는 한국어 안내와 함께 빌드를 중단한다)
# ============================================================================

appId: com.petitcalendar.app
productName: 쁘띠캘린더
# 실행 파일명은 ASCII 유지 (경로 인코딩·서명·채점 도구 호환) — 표시 이름은 위 한국어가 정본
executableName: PetitCalendar
copyright: "© 2026 firebird2405"

directories:
  output: dist
  buildResources: build

# 앱 코드는 asar로 봉인 (아래 fuse onlyLoadAppFromAsar와 세트)
asar: true

# 프로덕션 의존성 0 — 재빌드 단계 불필요
npmRebuild: false

# 오프라인·재현 빌드: npm install이 이미 받아둔 Electron 배포본을 그대로 사용
# (빌드 시 원격 재다운로드 방지)
electronDist: node_modules/electron/dist

# A46 경량화 ①: 로케일 팩 55개 → 한국어 + 영어만 (약 46MB 절감)
# 앱 자체 UI는 HTML 내장 한국어 — Chromium 내부 문자열 로케일만 해당.
electronLanguages:
  - ko
  - en-US

# ── A46 화이트리스트 ①: 앱 번들(asar)에는 셸 코드만 ─────────────────────────
# main.js 가 require 하는 셸 모듈 전부를 명시 동봉해야 패키지가 기동한다:
# preload.js(A43/A47/백업 UI)·migrate.js+migrate-dump.ps1(A43)·backup.js(백업 엔진)·
# lib-shared.js(main 프로세스 공용 유틸 — main/migrate/backup 이 require)
files:
  - main.js
  - preload.js
  - lib-shared.js
  - migrate.js
  - migrate-dump.ps1
  - backup.js
  - "!node_modules/**"

# ── A46 화이트리스트 ②: 저장소 원본 HTML·에셋을 resources/ 루트에 복사 ──────
# main.js의 repoRoot(path.resolve(__dirname,'..'))가 패키지에서 resources/를
# 가리키므로 개발 트리와 동일한 상대 구조가 성립한다.
# A42: 복사만 허용 — 어떤 후처리(민지피케이션·주입·치환)도 금지.
extraResources:
  - from: "../calendar.html"
    to: "."
  - from: "../postit.html"
    to: "."
  - from: "../assets"
    to: "assets"
    filter:
      - "**/*"

# ── Electron fuses (afterPack 훅으로 적용 — apply-fuses.js) ──────────────────
# ★ A42 채점 가능성 계약 ★
#   EnableNodeCliInspectArguments 는 반드시 true 유지.
#   Playwright _electron.launch 는 --inspect 계열 스위치로 main 프로세스에
#   붙는다 — 이 fuse를 끄면 "패키지 exe 채점"이 영구 불가능해진다.
#   (SCORECARD rev.6 초안 A42 및 하단 개정 절차 메모 명시)
#
# 구현 메모: electron-builder 26.x의 내장 electronFuses 옵션은 Node 20+ 전용
# (@noble/hashes 2.x ESM-only → Node 18에서 ERR_REQUIRE_ESM으로 빌드 자체 불가).
# 이 프로젝트는 Node 18 환경이므로 electron-builder 25.1.8 + afterPack 훅으로
# 동일 효과를 낸다. 훅이 적용하는 값(변경 금지):
#   EnableNodeCliInspectArguments=true(A42) · RunAsNode=false ·
#   EnableNodeOptionsEnvironmentVariable=false · OnlyLoadAppFromAsar=true
afterPack: ./apply-fuses.js

# ── Windows 타깃 ─────────────────────────────────────────────────────────────
win:
  target:
    - nsis
    - appx
  icon: build/icon.png

nsis:
  oneClick: true
  perMachine: false
  # 제거 시 사용자 데이터(userData) 보존 — 재설치 복원 경로 유지
  deleteAppDataOnUninstall: false
  artifactName: "PetitCalendar-Setup-${version}.${ext}"
  shortcutName: "쁘띠캘린더"

# ── MS Store(appx/msix) — 파트너 센터 identity 실값 주입 지점 ────────────────
# A48②: 매니페스트 Identity 는 플레이스홀더 리터럴 금지 — 아래 "여기만 채우면
# 완성" 3줄을 파트너 센터 실값으로 채우기 전에는 appx 타깃을 빌드하지 말 것
# (--dir·nsis 는 무관). npm run dist:appx 의 가드(check-appx-identity.js)가
# 미기입/형식 오류를 한국어로 안내하며 빌드를 중단한다.
# 값을 얻는 절차(스크린샷 수준 단계 설명): protocol/STORE-GUIDE.md
appx:
  displayName: 쁘띠캘린더
  applicationId: PetitCalendar
  backgroundColor: "#B08968"   # 코르크 브라운 (타일 배경)
  languages:
    - ko-KR
  showNameOnTiles: true
  #
  # ★★ 여기만 채우면 완성 — 아래 3줄의 맨 앞 "# " 를 지우고 값을 기입 ★★
  # 값 위치: 파트너 센터 → 앱 선택 → 제품 관리(Product management)
  #          → 제품 ID(Product identity) 화면 (protocol/STORE-GUIDE.md 3단계)
  #
  # identityName: 12345Firebird.PetitCalendar
  #   ↑ 화면의 "Package/Identity/Name" 값 그대로 (숫자+게시자.앱이름 형태)
  # publisher: CN=00000000-0000-0000-0000-000000000000
  #   ↑ 화면의 "Package/Identity/Publisher" 값 그대로 (반드시 CN= 으로 시작하는 GUID)
  # publisherDisplayName: firebird2405
  #   ↑ 화면의 "Package/Properties/PublisherDisplayName" 값 그대로 (게시자 표시 이름)

# publish 구성 없음 — 자동 업데이트·원격 요청 금지 (A44)
