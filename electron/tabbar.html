<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>쁘띠캘린더</title>
<!--
  쁘띠캘린더 — 셸 탭바 페이지 (단일 창 탭 모드의 창 기본 페이지, 셸 소유 — 앱 원본 아님)

  계약 (protocol/SCORECARD.md rev.8 A42):
    - [data-shell-tabbar] 루트 / 탭 [data-tab="postit"]·[data-tab="calendar"] (활성 표시)
    - [data-shell-settings-open] 설정 드로어 토글
    - [data-shell-settings] 설정 드로어: 기본 탭 세그 — 변경 즉시 저장
    - [data-startup-toggle] 윈도우 시작 시 자동 실행 체크박스 (드로어 안, 즉시 적용 —
      상태의 단일 진실은 OS. 앱 설정 모달의 같은 항목과 main push 로 양방향 동기)
    - 창은 항상 1개다 — 창 분리·재병합 진입점은 rev.8 에서 폐지됐다 (재도입 금지)
  셸 자체 훅 (채점 계약 아님 — 스모크·유지보수용):
    - [data-alwaystop-toggle] 항상 위 (발주 #30, 드로어 안 — 창 실측값 표시, 재기동 유지)
    - [data-capture-copy]·[data-capture-save] 보드 자랑하기 (발주 #31 — 활성 앱 뷰만 PNG로)
    - [data-shell-version] 버전 표기 (발주 #28① — 정본은 electron/package.json)
    - [data-alarm-badge] 캘린더 탭 알림 배지 (빨간 점 + 건수)
    - [data-alarm-strip] 미니 알림 스트립 (클릭 = 캘린더 탭 전환) / [data-alarm-strip-text]
    - [data-tab-indicator] 활성 탭 인디케이터 (transform 슬라이드)
  규칙:
    - 오프라인 전용 — 외부 리소스 0. 손글씨 폰트(Gaegu)는 저장소 로컬 번들(../assets/,
      OFL 1.1 — assets/ASSETS.md)만 상대 참조: 개발 트리(electron/../assets)와 패키지
      (resources/app.asar/../assets = resources/assets — electron-builder extraResources)
      양쪽에서 같은 상대 경로가 성립한다. A44/A1 준수.
    - 스크립트의 동적 텍스트는 textContent 만 사용 (innerHTML 계열 금지 조항)
    - 장식 모션은 transform/opacity 전용 0.18s — prefers-reduced-motion 과 앱 [효과]
      설정(postit-settings.anim ≠ "on")을 존중해 끈다 (body.motion 게이트)
    - 상단 header 높이 40px·드로어 높이 186px 은 main.js 의
      TABBAR_HEIGHT·SETTINGS_DRAWER_HEIGHT 와 동기 유지 (수동 관리 — 드로어에 줄을
      더하면 실측 높이(스크롤 없는 최소 높이)를 두 곳에 함께 반영한다)
-->
<style>
  @font-face {
    font-family: "Gaegu";
    src: url("../assets/Gaegu-Regular.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    --ink: #5e3e18;            /* 앱 공통 브라운 잉크 */
    --ink-soft: rgba(94, 62, 24, 0.72);
    --cork: #B08968;           /* 코르크 브라운 포인트 (브랜드 타일색) */
    --cork-deep: #7a5433;
    --accent: #FFD966;         /* 앱 공통 노랑 포인트 */
    --cream-hi: #fffbf0;
    --cream-lo: #f6ecd6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Gaegu", "Segoe UI", "Malgun Gothic", "맑은 고딕", sans-serif;
    color: var(--ink);
    background: var(--cream-lo);
    overflow: hidden;
    user-select: none;
  }

  /* ── 탭바 (고정 40px — main.js TABBAR_HEIGHT 동기) ── */
  header[data-shell-tabbar] {
    height: 40px;
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    gap: 8px;
    padding: 0 8px;
    background: linear-gradient(180deg, var(--cream-hi), var(--cream-lo));
    border-bottom: 2px solid var(--cork);
  }
  .tabs { position: relative; display: flex; align-items: flex-end; gap: 4px; }
  .tabs button {
    font: inherit;
    font-size: 16px;
    color: var(--ink-soft);
    padding: 5px 16px 6px;
    margin-bottom: -2px;                 /* 활성 탭이 하단 코르크 선과 이어지게 */
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    background: transparent;
    cursor: pointer;
    line-height: 1.2;
  }
  .tabs button:hover { background: rgba(94, 62, 24, 0.08); }
  .tabs button.active {
    color: var(--ink);
    font-weight: 700;
    background: #fff;
    border-color: var(--cork);
  }
  /* 활성 탭 인디케이터 — 노랑 밑줄이 활성 탭 아래로 슬라이드 (transform/opacity 전용) */
  .tab-indicator {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100px;                        /* 기준 폭 — scaleX 로 실제 탭 폭에 맞춘다 */
    height: 3px;
    background: var(--accent);
    transform-origin: left center;
    transform: translateX(0) scaleX(0);
    opacity: 0;
    pointer-events: none;
    z-index: 1;
  }
  .tab-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    margin-left: 6px;
    border-radius: 8px;
    background: #e05a4e;                 /* 빨간 점 + 건수 */
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    vertical-align: 1px;
  }
  .tab-badge[hidden] { display: none; }

  /* ── 미니 알림 스트립 (클릭 = 캘린더 탭 전환) — 헤더 40px 안에 산다 ── */
  .alarm-strip {
    font: inherit;
    flex: 0 1 auto;
    min-width: 0;
    max-width: 46%;
    margin: 6px 0;
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 12px;
    font-size: 13.5px;
    color: #7a3b32;
    border: 1px solid #e0a49b;
    border-radius: 9px;
    background: #fdeeea;
    cursor: pointer;
    line-height: 1.2;
    transform: translateY(-4px);
    opacity: 0;
  }
  .alarm-strip.shown { transform: translateY(0); opacity: 1; }
  .alarm-strip:hover { background: #fbe0da; }
  .alarm-strip[hidden] { display: none; }
  .alarm-strip .strip-text {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .actions { display: flex; align-items: center; gap: 6px; }
  .actions button {
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    padding: 4px 12px;
    border: 1px solid rgba(94, 62, 24, 0.35);
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    line-height: 1.2;
  }
  .actions button:hover { background: #fff; }
  .actions button:disabled { opacity: 0.55; cursor: default; }
  .actions button.gear.open { background: var(--accent); border-color: var(--cork-deep); }
  /* 보드 담기 버튼 — 좁은 창(최소 480px)에서도 탭·설정과 함께 들어가도록 조금 작게 */
  .actions button.cap { font-size: 13.5px; padding: 4px 9px; }

  /* ── 설정 드로어 (고정 186px — main.js SETTINGS_DRAWER_HEIGHT 동기)
        발주 #30 으로 [창] 행이, 발주 #28① 로 버전 줄이 늘어 138px → 186px ── */
  section[data-shell-settings] {
    height: 186px;
    padding: 10px 16px 8px;
    background: var(--cream-hi);
    border-bottom: 2px solid var(--cork);
    display: flex;
    flex-direction: column;
    gap: 8px;
    transform: translateY(0);
    opacity: 1;
  }
  section[data-shell-settings][hidden] { display: none; }
  section[data-shell-settings].anim-pre { transform: translateY(-10px); opacity: 0; }
  .seg-row { display: flex; align-items: center; gap: 10px; }
  .seg-label { font-size: 14px; font-weight: 700; width: 70px; color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--cork); border-radius: 9px; overflow: hidden; }
  .seg button {
    font: inherit;
    font-size: 14px;
    color: var(--ink-soft);
    padding: 4px 14px;
    border: none;
    background: rgba(255, 255, 255, 0.55);
    cursor: pointer;
    line-height: 1.2;
  }
  .seg button + button { border-left: 1px solid rgba(94, 62, 24, 0.25); }
  .seg button:hover { background: #fff; }
  .seg button.on {
    color: #4a2f12;
    font-weight: 700;
    background: var(--accent);
  }
  /* 체크박스 행 (윈도우 시작 시 자동 실행) — 세그 행과 같은 리듬으로 정렬 */
  .chk {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    line-height: 1.2;
  }
  .chk input {
    width: 15px;
    height: 15px;
    margin: 0;
    accent-color: var(--cork);
    cursor: pointer;
  }
  .chk input:disabled { cursor: default; }
  .chk-hint { font-size: 13px; color: var(--ink-soft); }
  .hint { font-size: 13px; color: var(--ink-soft); margin: 2px 0 0; line-height: 1.45; }
  .status { font-size: 13px; color: #a04638; margin: 0; min-height: 15px; line-height: 1.35; }
  .status.ok { color: var(--ink-soft); }

  /* ── 모션 게이트: body.motion 일 때만 전환 재생 (transform/opacity 전용, 0.18s) ── */
  body.motion .tab-indicator,
  body.motion .alarm-strip,
  body.motion section[data-shell-settings] {
    transition: transform 0.18s ease, opacity 0.18s ease;
  }
  /* OS 동작 축소 선호는 CSS 수준에서도 한 번 더 차단 (이중 방어) */
  @media (prefers-reduced-motion: reduce) {
    .tab-indicator, .alarm-strip, section[data-shell-settings] { transition: none !important; }
  }
</style>
</head>
<body>

<header data-shell-tabbar>
  <div class="tabs">
    <button type="button" data-tab="postit" title="포스트잇 월로 이동해요 (Ctrl+1)">🗒️ 포스트잇</button>
    <button type="button" data-tab="calendar" title="캘린더로 이동해요 (Ctrl+2)">📅 캘린더<span class="tab-badge" data-alarm-badge hidden></span></button>
    <span class="tab-indicator" data-tab-indicator></span>
  </div>
  <button type="button" class="alarm-strip" data-alarm-strip hidden title="캘린더 탭으로 이동해 알림을 확인해요">
    <span>🔔</span><span class="strip-text" data-alarm-strip-text></span>
  </button>
  <div class="actions">
    <!-- 보드 자랑하기 (발주 #31) — 지금 보이는 화면만 그림으로. 탭바·드로어는 프레임에 없다 -->
    <button type="button" class="cap" data-capture-copy title="지금 보이는 화면을 그림으로 클립보드에 복사해요">📋 복사</button>
    <button type="button" class="cap" data-capture-save title="지금 보이는 화면을 PNG 그림 파일로 저장해요">📸 저장</button>
    <button type="button" class="gear" data-shell-settings-open title="셸 설정을 열고 닫아요">⚙️ 설정</button>
  </div>
</header>

<section data-shell-settings hidden>
  <div class="seg-row">
    <span class="seg-label">기본 탭</span>
    <span class="seg">
      <button type="button" data-default-tab="postit" title="앱을 열면 포스트잇 탭으로 시작해요">포스트잇</button>
      <button type="button" data-default-tab="calendar" title="앱을 열면 캘린더 탭으로 시작해요">캘린더</button>
    </span>
  </div>
  <div class="seg-row">
    <span class="seg-label">시작</span>
    <label class="chk" title="컴퓨터를 켜면 쁘띠캘린더가 함께 열려요">
      <input type="checkbox" data-startup-toggle>
      <span>윈도우 시작 시 자동 실행</span>
    </label>
    <span class="chk-hint">컴퓨터를 켜면 쁘띠캘린더가 함께 열려요.</span>
  </div>
  <div class="seg-row">
    <span class="seg-label">창</span>
    <label class="chk" title="다른 창을 열어도 쁘띠캘린더가 위에 남아요">
      <input type="checkbox" data-alwaystop-toggle>
      <span>항상 위에 두기</span>
    </label>
    <span class="chk-hint">꾸며 둔 보드를 계속 보고 싶을 때 켜요.</span>
  </div>
  <p class="hint">설정은 바로 저장되고, 기본 탭은 다음 실행부터 적용돼요. (Ctrl+Tab으로 탭을 오갈 수 있어요)</p>
  <p class="hint" data-shell-version>쁘띠캘린더</p>
  <p class="status" data-shell-status></p>
</section>

<script>
(function () {
  'use strict';

  var api = window.petitShell;
  var tabButtons = Array.prototype.slice.call(document.querySelectorAll('[data-tab]'));
  var defaultTabButtons = Array.prototype.slice.call(document.querySelectorAll('[data-default-tab]'));
  var gearBtn = document.querySelector('[data-shell-settings-open]');
  var drawer = document.querySelector('[data-shell-settings]');
  var statusLine = document.querySelector('[data-shell-status]');
  var startupChk = document.querySelector('[data-startup-toggle]');
  var aotChk = document.querySelector('[data-alwaystop-toggle]');
  var versionLine = document.querySelector('[data-shell-version]');
  var capCopyBtn = document.querySelector('[data-capture-copy]');
  var capSaveBtn = document.querySelector('[data-capture-save]');
  var indicator = document.querySelector('[data-tab-indicator]');
  var badge = document.querySelector('[data-alarm-badge]');
  var strip = document.querySelector('[data-alarm-strip]');
  var stripText = document.querySelector('[data-alarm-strip-text]');

  function setStatus(msg, ok) {
    statusLine.textContent = msg || '';
    statusLine.classList.toggle('ok', ok === true);
  }

  /* ── 모션 게이트: OS 동작 축소 선호 또는 앱 [효과] 설정(postit-settings.anim ≠ "on")이면
        전환을 끈다 — 탭바는 앱과 같은 file:// 오리진이라 설정을 읽기만 한다 (쓰기 0건) ── */
  function calmMotion() {
    try {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return true;
    } catch (e) { /* matchMedia 불가 — 무해 */ }
    try {
      var raw = localStorage.getItem('postit-settings');
      if (raw) {
        var s = JSON.parse(raw);
        if (s && typeof s === 'object' && s.anim && s.anim !== 'on') return true;
      }
    } catch (e) { /* 부재·손상 — 기본(모션 켬) */ }
    return false;
  }
  function refreshMotionGate() {
    document.body.classList.toggle('motion', !calmMotion());
  }
  refreshMotionGate();
  try {
    window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', refreshMotionGate);
  } catch (e) { /* 구형 API — 무해 */ }
  /* 같은 오리진의 앱 창에서 [효과] 설정이 바뀌면 storage 이벤트로 따라간다 */
  window.addEventListener('storage', function (ev) {
    if (!ev || !ev.key || ev.key === 'postit-settings') refreshMotionGate();
  });

  /* 브리지 부재(비정상 기동)에도 페이지는 조용히 유지 — 콘솔 오류 0 원칙 */
  if (!api) {
    setStatus('셸과 연결하지 못했어요. 앱을 다시 실행해 주세요.');
    return;
  }

  /* ── 표시 갱신 (동적 텍스트는 배지 건수·알림 문구뿐 — 전부 textContent) ── */
  var activeTabNow = null;

  /* 활성 탭 인디케이터 배치 — 기준 폭 100px 를 translateX+scaleX 로 실제 탭에 맞춘다
     (transform/opacity 전용 — 폭·위치 속성 애니메이션 없음) */
  function placeIndicator() {
    if (!indicator) return;
    var btn = null;
    for (var i = 0; i < tabButtons.length; i++) {
      if (tabButtons[i].classList.contains('active')) { btn = tabButtons[i]; break; }
    }
    if (!btn) { indicator.style.opacity = '0'; return; }
    var x = btn.offsetLeft + 8;                       /* 탭 좌우 8px 여백 안쪽 밑줄 */
    var w = Math.max(12, btn.offsetWidth - 16);
    indicator.style.transform = 'translateX(' + x + 'px) scaleX(' + (w / 100) + ')';
    indicator.style.opacity = '1';
  }

  function markActiveTab(tab) {
    activeTabNow = tab;
    tabButtons.forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === tab);
    });
    placeIndicator();
  }
  function markSettings(st) {
    defaultTabButtons.forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-default-tab') === st.defaultTab);
    });
    /* 자동 실행 표시는 OS 실측값(main 이 매번 읽어 보낸다)만 따른다 — 탭바는 저장하지 않는다 */
    if (typeof st.openAtLogin === 'boolean') startupChk.checked = st.openAtLogin;
    /* 항상 위 표시도 창 실측값만 따른다 (발주 #30) */
    if (typeof st.alwaysOnTop === 'boolean') aotChk.checked = st.alwaysOnTop;
    /* 버전 정본 = electron/package.json (main 의 app.getVersion) — 발주 #28① */
    if (versionLine && typeof st.version === 'string' && st.version) {
      versionLine.textContent = '쁘띠캘린더 ' + st.version + ' · 인터넷 없이 이 컴퓨터에만 저장돼요.';
    }
  }

  /* ── 알림 배지 + 미니 스트립 (백그라운드 캘린더 탭의 일정 알림 릴레이) ── */
  function applyAlarms(al) {
    var count = al && typeof al.count === 'number' && al.count > 0 ? al.count : 0;
    var text = al && typeof al.text === 'string' ? al.text : '';
    if (count > 0) {
      badge.textContent = count > 99 ? '99+' : String(count);
      badge.hidden = false;
      var line = '일정 알림 ' + count + '건';
      var first = text.split('\n')[0].trim();
      if (first) line += ' — ' + first;
      stripText.textContent = line;
      if (strip.hidden) {
        strip.hidden = false;
        strip.classList.remove('shown');
        /* 다음 프레임에 shown — transform/opacity 페이드 인 (body.motion 게이트) */
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { strip.classList.add('shown'); });
        });
      }
    } else {
      badge.hidden = true;
      strip.hidden = true;
      strip.classList.remove('shown');
    }
  }

  function applyState(st) {
    if (!st || st.ok !== true) return;
    if (st.activeTab) markActiveTab(st.activeTab);
    markSettings(st);
    applyAlarms(st.alarms);
  }

  /* ── 설정 드로어 개폐 — main 이 앱 뷰를 내려 드로어 공간을 비워 준다.
        개폐 모션 0.18s (transform/opacity) — 닫기는 애니메이션 뒤에 hidden + 뷰 복귀 ── */
  var drawerOpen = false;
  var drawerCloseTimer = null;
  function setDrawer(open) {
    drawerOpen = open === true;
    gearBtn.classList.toggle('open', drawerOpen);
    setStatus('');
    if (drawerCloseTimer) { clearTimeout(drawerCloseTimer); drawerCloseTimer = null; }
    var motion = document.body.classList.contains('motion');
    if (drawerOpen) {
      drawer.hidden = false;
      if (motion) {
        drawer.classList.add('anim-pre');
        void drawer.offsetHeight; /* reflow — 시작 상태 확정 */
        drawer.classList.remove('anim-pre');
      }
      api.setSettings({ panelOpen: true }).catch(function () { /* 표시만 유지 */ });
    } else {
      var finishClose = function () {
        drawerCloseTimer = null;
        drawer.hidden = true;
        drawer.classList.remove('anim-pre');
        api.setSettings({ panelOpen: false }).catch(function () { /* 표시만 유지 */ });
      };
      if (motion && !drawer.hidden) {
        drawer.classList.add('anim-pre'); /* 위로 슬라이드 아웃 */
        drawerCloseTimer = setTimeout(finishClose, 180);
      } else {
        finishClose();
      }
    }
  }

  /* ── 탭 전환 (한 창 안의 z순서 재배치만 — 리로드 없음) ── */
  function requestTab(tab) {
    api.switchTab(tab).then(applyState).catch(function () {
      setStatus('탭을 전환하지 못했어요. 다시 시도해 주세요.');
    });
  }
  tabButtons.forEach(function (b) {
    b.addEventListener('click', function () {
      if (drawerOpen) setDrawer(false);
      requestTab(b.getAttribute('data-tab'));
    });
  });

  /* 미니 알림 스트립 — 클릭 = 캘린더 탭 전환 (main 이 배지를 비우고 상태를 push) */
  strip.addEventListener('click', function () {
    if (drawerOpen) setDrawer(false);
    requestTab('calendar');
  });

  /* ── 설정 세그 — 변경 즉시 저장 ── */
  gearBtn.addEventListener('click', function () { setDrawer(!drawerOpen); });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && drawerOpen) setDrawer(false);
  });
  defaultTabButtons.forEach(function (b) {
    b.addEventListener('click', function () {
      api.setSettings({ defaultTab: b.getAttribute('data-default-tab') }).then(applyState).catch(function () {
        setStatus('설정을 저장하지 못했어요.');
      });
    });
  });

  /* ── 윈도우 시작 시 자동 실행 — 즉시 적용, 표시는 항상 실제 OS 값으로 확정 ──
     실패해도 크래시·모달 없이 안내 한 줄 + 체크 상태를 실측값으로 되돌린다. */
  startupChk.addEventListener('change', function () {
    var want = startupChk.checked;
    startupChk.disabled = true;
    api.setStartup(want).then(function (res) {
      startupChk.disabled = false;
      if (res && typeof res.openAtLogin === 'boolean') startupChk.checked = res.openAtLogin;
      if (res && res.ok === true) {
        setStatus(want ? '컴퓨터를 켜면 쁘띠캘린더가 함께 열려요.' : '윈도우 시작 시 자동 실행을 껐어요.', true);
      } else {
        setStatus((res && res.reason) || '윈도우 시작 설정을 바꾸지 못했어요.');
      }
    }).catch(function () {
      startupChk.disabled = false;
      startupChk.checked = !want;
      setStatus('윈도우 시작 설정을 바꾸지 못했어요.');
    });
  });

  /* ── 항상 위 (발주 #30) — 즉시 적용, 표시는 창 실측값으로 확정 ──
     실패해도 크래시·모달 없이 안내 한 줄 + 체크 상태를 실측값으로 되돌린다. */
  aotChk.addEventListener('change', function () {
    var want = aotChk.checked;
    aotChk.disabled = true;
    api.setAlwaysOnTop(want).then(function (res) {
      aotChk.disabled = false;
      if (res && typeof res.alwaysOnTop === 'boolean') aotChk.checked = res.alwaysOnTop;
      if (res && res.ok === true) {
        setStatus(want ? '이제 다른 창 위에 떠 있어요.' : '항상 위를 껐어요.', true);
      } else {
        setStatus((res && res.reason) || '항상 위 설정을 바꾸지 못했어요.');
      }
    }).catch(function () {
      aotChk.disabled = false;
      aotChk.checked = !want;
      setStatus('항상 위 설정을 바꾸지 못했어요.');
    });
  });

  /* ── 보드 자랑하기 (발주 #31) — 지금 보이는 앱 화면만 그림으로 (탭바·드로어 제외).
        복사·저장 모두 로컬 처리이고 외부로 나가는 통신은 없다. */
  /* 결과 알림: 드로어가 닫혀 있으면 [data-shell-status] 는 안 보인다. 그래서 버튼 라벨을
     잠깐 바꿔 그 자리에서 결과를 말한다 (레이아웃 변화·새 오버레이 없음). */
  function flashLabel(btn, text, ms) {
    var original = btn.getAttribute('data-label-original');
    if (original === null) {
      original = btn.textContent;
      btn.setAttribute('data-label-original', original);
    }
    if (btn._flashTimer) clearTimeout(btn._flashTimer);
    btn.textContent = text;
    btn._flashTimer = setTimeout(function () {
      btn._flashTimer = null;
      btn.textContent = btn.getAttribute('data-label-original') || original;
    }, ms || 2200);
  }

  function runCapture(btn, mode, busyLabel) {
    if (!btn) return;
    btn.addEventListener('click', function () {
      if (drawerOpen) setDrawer(false);      /* 드로어는 캡처 프레임 밖이지만 화면을 가린다 */
      btn.disabled = true;
      flashLabel(btn, busyLabel, 30000);     /* 저장 대화상자가 열려 있는 동안 유지 */
      api.captureBoard(mode).then(function (res) {
        btn.disabled = false;
        if (!res || res.ok !== true) {
          flashLabel(btn, '⚠️ 실패');
          setStatus((res && res.reason) || '보드를 그림으로 담지 못했어요.');
          return;
        }
        if (res.canceled) { flashLabel(btn, '취소됨', 1200); return; }
        if (res.copied) {
          flashLabel(btn, '✅ 복사됨');
          setStatus('보드를 그림으로 복사했어요. 붙여넣기(Ctrl+V)로 자랑해 보세요!', true);
        } else {
          flashLabel(btn, '✅ 저장됨');
          setStatus('보드를 그림으로 저장했어요: ' + (res.file || ''), true);
        }
      }).catch(function () {
        btn.disabled = false;
        flashLabel(btn, '⚠️ 실패');
        setStatus('보드를 그림으로 담지 못했어요.');
      });
    });
  }
  runCapture(capCopyBtn, 'clipboard', '담는 중…');
  runCapture(capSaveBtn, 'file', '저장 중…');

  /* ── main push 구독 — 단축키 탭 전환·알림 배지 등 탭바 요청 없이 바뀐 상태 반영 ── */
  if (typeof api.onUiPush === 'function') {
    api.onUiPush(applyState);
  }

  /* 폰트 로드·창 리사이즈 후 인디케이터 재배치 (탭 폭이 달라진다) */
  try {
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { placeIndicator(); });
    }
  } catch (e) { /* 무해 */ }
  window.addEventListener('resize', placeIndicator);

  /* ── 초기 상태 반영 ── */
  api.getState().then(applyState).catch(function () {
    setStatus('셸 상태를 읽지 못했어요.');
  });
})();
</script>

</body>
</html>
